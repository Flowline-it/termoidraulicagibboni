name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run download --prefix apps/pocketbase
      - name: Migrazioni PocketBase su database vuoto
        run: |
          npm run pb --prefix apps/pocketbase -- migrate up
          npm run pb --prefix apps/pocketbase -- superuser upsert ci@gibboni.it CiPassword2026
