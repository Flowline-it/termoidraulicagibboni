<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File di esempio</title>
<style>
:root{--bg:#f5f3ef;--fg:#14233c;--muted:#5b6475;--accent:#ed6407}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a2c;--fg:#f1ede6;--muted:#a3abba}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;box-sizing:border-box}
main{max-width:420px;border-left:4px solid var(--accent);padding:8px 0 8px 20px}
h1{font-size:20px;margin:0 0 8px}
p{color:var(--muted);line-height:1.5;margin:0}
code{word-break:break-all}
</style>
</head>
<body>
<main>
<h1>File non disponibile nell'anteprima</h1>
<p>Nella versione dimostrativa i file caricati restano visibili solo fino al ricaricamento della pagina. Nel gestionale definitivo vengono archiviati in modo permanente.</p>
<p id="n" style="margin-top:12px"></p>
</main>
<script>try{var n=decodeURIComponent(location.hash.slice(1));if(n){var c=document.createElement('code');c.textContent=n;document.getElementById('n').appendChild(c)}}catch(e){}</script>
</body>
</html>
